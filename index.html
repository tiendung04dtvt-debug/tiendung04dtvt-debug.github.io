<script>
'use strict';
const EXAMS=JSON.parse(document.getElementById('quiz-data').textContent);
const STORE_KEY='cntt-basic-practice-v1';
let storageAvailable=true;
let db=loadDb();
let view='home';
let homeTab='exams';
let latestResult=null;
let timerHandle=null;
const main=document.getElementById('main');
function emptyDb(){
  return {version:2,mistakes:{},attempts:{},best:{},session:null,lastResult:null};
}
function loadDb(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw){localStorage.setItem(STORE_KEY,JSON.stringify(emptyDb()));return emptyDb();}
    const saved=JSON.parse(raw);
    const loaded={ ...emptyDb(), ...saved, mistakes:saved.mistakes||{}, attempts:saved.attempts||{}, best:saved.best||{} };
    if(Number(saved.version||1)<2&&!(loaded.attempts[11]>0)){
      const seeded=new Set([2,14,17,20,37,39]);
      loaded.mistakes[11]=(loaded.mistakes[11]||[]).filter(n=>!seeded.has(Number(n)));
    }
    loaded.version=2;localStorage.setItem(STORE_KEY,JSON.stringify(loaded));
    return loaded;
  }catch(e){storageAvailable=false;return emptyDb();}
}
function saveDb(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(db));}
  catch(e){storageAvailable=false;showStorageWarning();}
}
function showStorageWarning(){
  const s=document.getElementById('storageStatus');
  if(s)s.textContent='Không lưu được trong trình duyệt';
  const n=document.getElementById('storageWarning');
  if(n)n.classList.remove('hidden');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function examById(id){return EXAMS.find(e=>e.id===Number(id));}
function questionById(exam,id){return exam.questions.find(q=>q.n===Number(id));}
function explainQuestion(d){
  const answer=String(d.options[d.correct]||'').replace(/^[a-d][.)]\s*/i,'');
  const prompt=String(d.prompt||'');
  const p=prompt.toLowerCase();
  const a=answer.toLowerCase();
  let reason='';
  const context=p+' '+a;
  // Put exact-question cases first so broad keyword rules cannot override them.
  if(p.includes('soạn một thư điện tử mới')&&a==='compose') reason='Compose nghĩa là “soạn thư”. Bấm nút này trong Gmail sẽ mở khung thư mới để nhập người nhận, chủ đề và nội dung; Attachment đính kèm tệp, còn Reply trả lời thư đang mở.';
  else if(p.includes('gửi kèm một tệp')||p.includes('muốn gửi kèm file')) reason='Attachment là nút đính kèm tệp vào email. Chọn tệp trên máy, chờ tải lên xong rồi mới gửi; Compose tạo thư mới và Reply trả lời thư đang đọc.';
  else if(p.includes('email không mong muốn')||p.includes('email rác')) reason='Spam đánh dấu thư là rác để lọc thư không mong muốn khỏi hộp thư đến. Delete chỉ xóa thư hiện tại; Reply/Forward không chặn thư rác.';
  else if(p.includes('các email rác được lưu')) reason='Thư bị đánh dấu Spam được chuyển vào thư mục Spam/Junk để tách khỏi thư bình thường. Có thể kiểm tra thư mục này để phục hồi nhầm lẫn hoặc xóa thư rác.';
  else if(p.includes('email) là đúng')||p.includes('electronic mail')) reason='Email viết tắt của Electronic Mail, nghĩa là thư điện tử. Dịch vụ này gửi/nhận thư qua mạng tới hộp thư của người nhận.';
  else if(p.includes('lợi thế của thư điện tử')) reason='Email thường truyền đi nhanh hơn thư giấy vì được gửi qua mạng trong thời gian ngắn. Tốc độ không đồng nghĩa luôn an toàn hoặc chắc chắn được phát tới người nhận; địa chỉ và kết nối vẫn phải đúng.';
  else if(p.includes('trả lời ngay thư điện tử')) reason='Reply trả lời người gửi của thư đang mở và thường giữ câu trả lời trong cùng chuỗi hội thoại. Compose bắt đầu thư mới; Forward chuyển tiếp thư cho người khác.';

  else if(p.includes('gỡ bỏ 1 chương trình')||p.includes('gỡ bỏ một chương trình')) reason='Uninstall chạy trình gỡ để xóa chương trình đã cài cùng các thành phần liên quan. Xóa biểu tượng shortcut chỉ bỏ lối tắt, không gỡ chương trình.';
  else if(p.includes('thay đổi cách thức đăng nhập')) reason='Mở Control Panel > User Accounts > Change the way users log on or off để chỉnh màn hình chào mừng/chuyển đổi người dùng. Đây là cài đặt tài khoản, không phải thiết lập mạng hay ổ đĩa.';
  else if(p.includes('khi chèn hình ảnh vào word')&&a.includes('tất cả')) reason='Các cách được liệt kê đều có thể đưa ảnh vào Word (ví dụ chèn từ tệp hoặc dán ảnh đã sao chép), nên chọn “Tất cả”. Khác nhau ở nguồn ảnh và thao tác; sau khi chèn có thể chỉnh kích cỡ/vị trí.';
  else if(p.includes('biểu thức =sum(9,1,max(3,5,7))')) reason='Tính từ trong ra ngoài: MAX(3,5,7)=7, rồi SUM(9,1,7)=9+1+7=17. Hàm lồng trong SUM được tính trước khi cộng.';
  else if(p.includes('max(30,10,65,5)')) reason='MAX so sánh các đối số 30, 10, 65 và 5 rồi trả số lớn nhất là 65. Hàm không cộng các số.';
  else if(p.includes('max(3,14,-25,5)')) reason='Trong các số 3, 14, -25 và 5, số lớn nhất là 14, nên MAX trả 14. Số âm vẫn được so sánh theo giá trị của nó.';
  else if(p.includes('tên thư mục')&&p.includes('windows 7')) reason='Tên thư mục có thể dài tối đa 255 ký tự nhưng không được chứa ký tự dành riêng như \\ / : * ? " < > |. Dấu ? là ký tự đại diện trong đường dẫn nên Windows cấm dùng trong tên.';
  else if(p.includes('chọn phát biểu đúng')&&a.includes('two content')) reason='Layout Two Content có 3 placeholder: một khung tiêu đề và hai khung nội dung. Vì vậy số 3 tính cả tiêu đề; hai vùng nội dung là hai khung đặt cạnh nhau.';
  else if(p.includes('#####')) reason='Trong ô số Excel, ##### thường có nghĩa cột hẹp nên không đủ chỗ hiển thị số; hãy kéo rộng cột hoặc giảm số lẻ. Với ô ngày/giờ âm cũng có thể hiện ##### do giá trị không biểu diễn được.';
  else if(p.includes('xóa vĩnh viễn')&&a.includes('shift')) reason='Giữ Shift khi xóa sẽ bỏ qua Recycle Bin, nên tệp không thể phục hồi bằng cách mở thùng rác. Chỉ dùng khi chắc chắn; cách bấm cụ thể trong đáp án phụ thuộc menu/phiên bản Windows.';
  else if(p.includes('thay đổi kích cỡ của trang thuyết trình')) reason='On-screen Show thiết lập tỷ lệ/kích thước slide cho kiểu màn hình trình chiếu, chẳng hạn 16:9. Nó không phải lệnh phóng cửa sổ PowerPoint; khổ slide điều khiển tỷ lệ khi trình bày/in.';
  else if(p.includes('đổi chiều các hộp dữ liệu')) reason='Right to Left đổi hướng sắp xếp nội dung/hộp trong sơ đồ theo chiều phải sang trái. Câu này nói về hướng trình bày sơ đồ, không phải căn lề văn bản thông thường.';
  return `Đáp án đúng: ${answer}.\nLý do: ${reason}`;
}
function toggleExplanation(n){
  const panel=document.getElementById(`explanation-${n}`);const button=document.getElementById(`explanation-button-${n}`);if(!panel||!button)return;
  const opening=panel.classList.contains('hidden');panel.classList.toggle('hidden',!opening);button.setAttribute('aria-expanded',String(opening));button.textContent=opening?'Ẩn giải thích':'Giải thích câu hỏi';
}
function mistakeIds(id){return [...new Set((db.mistakes[id]||[]).map(Number))].sort((a,b)=>a-b);}
function shuffledQuestionIds(exam){const ids=exam.questions.map(q=>q.n);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}return ids;}
function countAnswered(){return db.session?Object.keys(db.session.answers||{}).length:0;}
function navigateTab(tab){homeTab=tab;view='home';render();window.scrollTo({top:0,behavior:'smooth'});}
function startQuiz(id,shuffle=false){
  id=Number(id);
  if(db.session){
    if(db.session.examId===id){view='exam';render();return;}
    alert('Bạn đang có một bài làm được lưu. Hãy tiếp tục hoặc bỏ bài đang làm trước.');return;
  }
  const exam=examById(id);if(!exam)return;
  db.session={examId:id,mode:'exam',shuffled:Boolean(shuffle),questionIds:shuffle?shuffledQuestionIds(exam):exam.questions.map(q=>q.n),answers:{},deadline:Date.now()+30*60*1000};
  saveDb();view='exam';render();window.scrollTo(0,0);
}
function startReview(id){
  id=Number(id);const ids=mistakeIds(id);
  if(!ids.length){alert('Đề này chưa có câu sai cần ôn.');return;}
  if(db.session){
    if(db.session.examId===id&&db.session.mode==='review'){view='exam';render();return;}
    alert('Bạn đang có một bài làm được lưu. Hãy tiếp tục hoặc bỏ bài đang làm trước.');return;
  }
  db.session={examId:id,mode:'review',questionIds:ids,answers:{},deadline:null};
  saveDb();view='exam';render();window.scrollTo(0,0);
}
function resumeSession(){view='exam';render();window.scrollTo(0,0);}
function leaveSession(){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}view='home';render();window.scrollTo(0,0);}
function discardSession(){if(!db.session)return;if(confirm('Bỏ bài đang làm? Các đáp án đã chọn của bài này sẽ bị xóa.')){db.session=null;saveDb();view='home';render();}}
function render(){
  if(timerHandle){clearInterval(timerHandle);timerHandle=null;}
  if(view==='exam'&&db.session)renderExam();
  else if(view==='result'&&latestResult)renderResult(latestResult);
  else if(view==='bank')renderHome('bank');
  else renderHome(homeTab);
  if(!storageAvailable)showStorageWarning();
}
function renderHome(tab='exams'){
  homeTab=tab;
  const totalMistakes=Object.values(db.mistakes).reduce((s,a)=>s+(a||[]).length,0);
  const sessionBanner=db.session?`<section class="notice warning" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span><strong>Bài đang lưu:</strong> ${esc(examById(db.session.examId)?.title||'Đề')} · ${db.session.mode==='review'?'ôn câu sai':'thi thử'} · ${countAnswered()}/${db.session.questionIds.length} câu đã chọn</span><span style="display:flex;gap:8px"><button class="btn small" onclick="resumeSession()">Tiếp tục</button><button class="btn danger small" onclick="discardSession()">Bỏ bài</button></span></section>`:'';
  const warning=`<div id="storageWarning" class="notice error hidden">Trình duyệt đang chặn lưu dữ liệu. Hãy tải sao lưu định kỳ hoặc mở file bằng Chrome/Edge bình thường.</div>`;
  let body='';
  if(tab==='exams'){
    const cards=EXAMS.map((e,i)=>{
      const mistakes=mistakeIds(e.id);const active=db.session?.examId===e.id;const otherActive=db.session&&db.session.examId!==e.id;
      const best=db.best[e.id];const attempts=db.attempts[e.id]||0;const extra=e.id>10;
      return `<article class="panel exam-card ${extra?'extra':''}"><div class="exam-tag">${extra?'Bài bổ sung từ PDF':`Đề ${String(i+1).padStart(2,'0')}`}</div><h3>${esc(e.title)}</h3><div class="exam-meta">40 câu · 30 phút</div>${best!==undefined?`<div class="progress" title="Điểm tốt nhất ${best}/40"><span style="width:${Math.round(best/40*100)}%"></span></div>`:''}<div class="exam-stats"><span>${attempts} lượt thi</span>${best!==undefined?`<span>Điểm tốt nhất ${best}/40</span>`:''}<span class="mistake-count">${mistakes.length} câu sai cần ôn</span></div><div class="exam-actions"><button class="btn" ${otherActive?'disabled':''} onclick="${active?`startQuiz(${e.id})`:`startQuiz(${e.id},false)`}">${active?(db.session.mode==='review'?'Tiếp tục ôn tập':'Tiếp tục bài thi'):'Bắt đầu làm'}</button>${!active?`<button class="btn secondary" ${otherActive?'disabled':''} onclick="startQuiz(${e.id},true)">Xáo trộn đề</button>`:''}<button class="btn secondary" ${!mistakes.length||otherActive?'disabled':''} onclick="startReview(${e.id})">Ôn câu sai (${mistakes.length})</button></div></article>`;
    }).join('');
    body=`<div class="section-head"><div><h2>Chọn đề luyện tập</h2><p>Hoàn thành bài rồi nộp để xem điểm và đáp án đúng.</p></div><span class="pill" style="background:#eaf0fb;color:#415675">${EXAMS.length} bộ · 440 câu</span></div><div class="grid">${cards}</div>`;
  } else {
    const cards=EXAMS.map((e,i)=>{
      const ids=mistakeIds(e.id);const extra=e.id>10;
      const list=ids.length?`<ul class="bank-list">${ids.map(n=>{const q=questionById(e,n);return `<li><b>Câu ${String(n).padStart(2,'0')}</b><span class="preview">${esc(q?.prompt||'')}</span></li>`;}).join('')}</ul>`:`<div class="empty">Chưa có câu sai lưu ở đề này.</div>`;
      return `<article class="panel bank-card"><div class="bank-head"><div><div class="exam-tag">${extra?'Bài bổ sung từ PDF':`Đề ${String(i+1).padStart(2,'0')}`}</div><h3>${esc(e.title)}</h3><p>${ids.length?`${ids.length} câu cần làm lại`:'Kho câu sai đang trống'}</p></div><span class="count-badge">${ids.length} câu</span></div>${list}${ids.length?`<div class="bank-actions"><button class="btn" ${db.session?'disabled':''} onclick="startReview(${e.id})">Làm lại ${ids.length} câu sai</button></div>`:''}</article>`;
    }).join('');
    body=`<div class="section-head"><div><h2>Kho câu sai theo từng đề</h2><p>Khi ôn lại và trả lời đúng, câu sẽ được gỡ khỏi kho của đề đó.</p></div><span class="pill" style="background:#fff0f0;color:#a4343a">${totalMistakes} câu đang lưu</span></div><div class="grid">${cards}</div>`;
  }
  const recent=db.lastResult?`<section class="panel recent"><div><small>Lần nộp gần nhất · ${esc(new Date(db.lastResult.completedAt).toLocaleString('vi-VN'))}</small><strong>${esc(examById(db.lastResult.examId)?.title||'Đề')} · ${db.lastResult.score}/${db.lastResult.total} điểm</strong></div><span class="exam-meta">${db.lastResult.wrongCount} câu sai trong lượt đó</span></section>`:'';
  main.innerHTML=`<section class="panel hero"><h2>Luyện đề, xem lỗi, làm lại câu sai</h2><p>Chọn một đề để làm như bài thi 40 câu trong 30 phút. Đáp án chỉ hiện sau khi nộp; tiến độ được tự lưu trên trình duyệt.</p><div class="hero-pills"><span class="pill">10 đề chính thức</span><span class="pill">+ 1 bài PDF 40 câu</span><span class="pill">Lưu riêng câu sai từng đề</span></div></section>${sessionBanner}${warning}<nav class="tabs"><button class="tab ${tab==='exams'?'active':''}" onclick="navigateTab('exams')">Luyện đề</button><button class="tab ${tab==='bank'?'active':''}" onclick="navigateTab('bank')">Kho câu sai (${totalMistakes})</button></nav>${body}${recent}`;
  if(!storageAvailable)showStorageWarning();
}
function updateProgressUI(){
  const s=db.session;if(!s)return;
  const answered=Object.keys(s.answers).length;const total=s.questionIds.length;
  const p=document.getElementById('answeredText');if(p)p.textContent=`Đã trả lời ${answered}/${total}`;
  const bar=document.getElementById('quizProgressFill');if(bar)bar.style.width=`${Math.round(answered/total*100)}%`;
  for(const n of s.questionIds){const b=document.getElementById(`jump-${n}`);if(b)b.classList.toggle('answered',s.answers[n]!==undefined);}
}
function renderExam(){
  const s=db.session;const exam=examById(s.examId);if(!exam){db.session=null;saveDb();view='home';render();return;}
  const qs=s.questionIds.map(n=>questionById(exam,n)).filter(Boolean);
  const isTimed=s.mode==='exam';const answered=Object.keys(s.answers||{}).length;
  const nav=qs.map(q=>`<button type="button" id="jump-${q.n}" class="${s.answers[q.n]!==undefined?'answered':''}" onclick="jumpTo(${q.n})" aria-label="Đi tới câu ${q.n}">${q.n}</button>`).join('');
  const cards=qs.map(q=>{
    const choices=q.options.map((opt,i)=>`<label class="choice ${s.answers[q.n]===i?'selected':''}"><input type="radio" name="question-${q.n}" value="${i}" ${s.answers[q.n]===i?'checked':''} onchange="chooseAnswer(${q.n},${i})"><span class="radio" aria-hidden="true"></span><span class="choice-text">${esc(opt)}</span></label>`).join('');
    return `<section class="panel question-card" id="question-${q.n}"><div class="q-title"><span class="q-number">${String(q.n).padStart(2,'0')}</span><div class="q-prompt">${esc(q.prompt)}</div></div><div class="choices">${choices}</div></section>`;
  }).join('');
  main.innerHTML=`<div class="quiz-header"><div class="quiz-head-row"><div class="quiz-name"><button class="btn ghost small" onclick="leaveSession()">← Danh sách đề</button><h2>${esc(exam.title)} <span class="exam-meta">${s.mode==='review'?'· Ôn câu sai':'· Bài thi'}${s.mode==='exam'&&s.shuffled?' · Đã xáo trộn':''}</span></h2></div><div id="timer" class="timer">${isTimed?'30:00':'Ôn tập'}</div></div><div class="quiz-status"><span id="answeredText">Đã trả lời ${answered}/${qs.length}</span><span>${qs.length} câu ${isTimed?'· 30 phút':'· không tính giờ'}</span></div><div class="quiz-progress"><span id="quizProgressFill" style="width:${Math.round(answered/qs.length*100)}%"></span></div></div><div class="jump-nav" aria-label="Đi đến câu hỏi">${nav}</div>${cards}<div class="quiz-footer"><span>Đã chọn <strong id="answeredFooter">${answered}/${qs.length}</strong> câu</span><button class="btn" onclick="submitQuiz(false)">${s.mode==='review'?'Hoàn tất ôn tập':'Nộp bài'}</button></div>`;
  if(isTimed)startTimer();
}
function chooseAnswer(n,i){if(!db.session)return;db.session.answers[n]=i;saveDb();const card=document.getElementById(`question-${n}`);if(card){card.querySelectorAll('.choice').forEach((el,k)=>el.classList.toggle('selected',k===i));}const f=document.getElementById('answeredFooter');if(f)f.textContent=`${countAnswered()}/${db.session.questionIds.length}`;updateProgressUI();}
function jumpTo(n){document.getElementById(`question-${n}`)?.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.jump-nav button').forEach(b=>b.classList.remove('current'));document.getElementById(`jump-${n}`)?.classList.add('current');}
function startTimer(){
 const el=document.getElementById('timer');const s=db.session;if(!el||!s)return;
 const tick=()=>{if(!db.session||!db.session.deadline)return;const remaining=Math.max(0,Math.ceil((db.session.deadline-Date.now())/1000));const m=String(Math.floor(remaining/60)).padStart(2,'0');const sec=String(remaining%60).padStart(2,'0');el.textContent=`${m}:${sec}`;el.classList.toggle('low',remaining<=300);if(remaining<=0){clearInterval(timerHandle);timerHandle=null;submitQuiz(true);}};
 tick();timerHandle=setInterval(tick,1000);
}
function submitQuiz(force){
 const s=db.session;if(!s)return;const missing=s.questionIds.filter(n=>s.answers[n]===undefined).length;
 if(!force&&missing&&!confirm(`Bạn còn ${missing} câu chưa trả lời. Nộp bài luôn chứ?`))return;
 const exam=examById(s.examId);const details=s.questionIds.map(n=>{const q=questionById(exam,n);const selected=s.answers[n];return {n,prompt:q.prompt,options:q.options,selected:selected===undefined?null:selected,correct:q.answer,isCorrect:selected===q.answer};});
 const score=details.filter(d=>d.isCorrect).length;const wrong=details.filter(d=>!d.isCorrect).map(d=>d.n);
 const attempted=new Set(s.questionIds);const bank=new Set(mistakeIds(s.examId).filter(n=>!attempted.has(n)));for(const n of wrong)bank.add(n);db.mistakes[s.examId]=[...bank].sort((a,b)=>a-b);
 if(s.mode==='exam'){db.attempts[s.examId]=(db.attempts[s.examId]||0)+1;db.best[s.examId]=Math.max(db.best[s.examId]??0,score);}
 const result={examId:s.examId,mode:s.mode,score,total:details.length,wrongCount:wrong.length,completedAt:new Date().toISOString(),details,remainingMistakes:db.mistakes[s.examId].length};
 db.lastResult={examId:result.examId,score,total:result.total,wrongCount:result.wrongCount,completedAt:result.completedAt};db.session=null;saveDb();if(timerHandle){clearInterval(timerHandle);timerHandle=null;}latestResult=result;view='result';render();window.scrollTo({top:0,behavior:'smooth'});
}
function renderResult(r){
  const exam=examById(r.examId);const percent=Math.round(r.score/r.total*100);
  const questionHtml=r.details.map(d=>`<article class="panel wrong-result ${d.isCorrect?'correct-result':'incorrect'}"><h4>Câu ${String(d.n).padStart(2,'0')}. ${esc(d.prompt)}</h4><div class="answer-line ${d.isCorrect?'correct':'incorrect'}"><span class="label">Bạn đã chọn:</span><span class="value">${d.selected===null?'Chưa trả lời':esc(d.options[d.selected])}</span></div>${d.isCorrect?'':`<div class="answer-line correct"><span class="label">Đáp án đúng:</span><span class="value">${esc(d.options[d.correct])}</span></div>`}<button type="button" class="btn secondary small" id="explanation-button-${d.n}" aria-expanded="false" onclick="toggleExplanation(${d.n})">Giải thích câu hỏi</button><div id="explanation-${d.n}" class="notice hidden" style="margin-top:10px;white-space:pre-line">${esc(explainQuestion(d))}</div></article>`).join('');
  main.innerHTML=`<section class="panel result-hero"><div class="score-ring"><strong>${r.score}</strong><span>trên ${r.total}</span></div><h2>${r.mode==='review'?'Kết quả ôn câu sai':'Đã nộp bài'}</h2><p><strong>${esc(exam.title)}</strong> · ${percent}% đúng · ${r.wrongCount} câu sai/chưa trả lời</p><p>${r.remainingMistakes?`Còn ${r.remainingMistakes} câu trong kho để làm lại.`:'Kho câu sai của đề này đã trống.'}</p><div class="result-actions"><button class="btn" onclick="navigateTab('bank')">Mở kho câu sai (${r.remainingMistakes})</button><button class="btn secondary" onclick="startQuiz(${r.examId})">Làm lại toàn đề</button><button class="btn ghost" onclick="navigateTab('exams')">Về danh sách đề</button></div></section><section class="review-results"><div class="section-head"><div><h2>Đối chiếu câu trả lời</h2><p>Bấm “Giải thích câu hỏi” ở câu bạn muốn xem lời giải ngắn.</p></div></div>${questionHtml}</section>`;
}
function exportBackup(){
 const payload={app:'cntt-basic-practice',version:1,exportedAt:new Date().toISOString(),data:db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sao-luu-on-thi-cntt-co-ban.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById('importFile').addEventListener('change',async ev=>{const file=ev.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(x.app!=='cntt-basic-practice'||!x.data||x.version!==1)throw new Error('Bản sao lưu không đúng định dạng.');if(!confirm('Khôi phục sẽ thay dữ liệu ôn tập hiện tại. Tiếp tục?'))return;db={...emptyDb(),...x.data};saveDb();view='home';latestResult=null;render();alert('Đã khôi phục dữ liệu.');}catch(err){alert(err.message||'Không đọc được file sao lưu.');}finally{ev.target.value='';}});
window.startQuiz=startQuiz;window.startReview=startReview;window.resumeSession=resumeSession;window.leaveSession=leaveSession;window.discardSession=discardSession;window.navigateTab=navigateTab;window.chooseAnswer=chooseAnswer;window.jumpTo=jumpTo;window.submitQuiz=submitQuiz;window.exportBackup=exportBackup;
if(db.session)view='exam';
render();
</script>
</body>
